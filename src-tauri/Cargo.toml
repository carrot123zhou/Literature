[package]
name = "literature"
version = "0.1.1"
description = "Structured literature processing workbench"
authors = ["Literature contributors"]
edition = "2021"

[lib]
name = "literature_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }
