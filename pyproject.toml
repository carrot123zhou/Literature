[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-workbench"
version = "0.1.0"
description = "Local-first structured literature processing workbench"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "python-docx>=1.2,<2",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]
packaging = ["pyinstaller>=6.15,<7"]

[project.scripts]
literature = "literature.cli:main"
literature-api = "literature.api:main"

[tool.setuptools.packages.find]
include = ["literature*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
